[project]
site_name = "Nick's Recipes"
site_url = "https://vogt4nick.github.io/recipes.vogt4nick.com"
docs_dir = "src/en"
site_dir = "site/en"

extra_css = ["assets/stylesheets/extra.css"]

[project.extra.cite]
"bitterman_die_österreichische_küche" ="Bitterman, Adi, Ingrid Pernkopf, und Renate Wagner-Wittula. [*Die Österreichische Küche*](https://www.amazon.de/dp/3222140251). 1. Edition. Pichler Verlag in Verlagsgruppe Styria GmbH & Co. KG, 15 September 2018."
bittman_how_to_cook_everything = "Bittman, Mark. [*How to Cook Everything*](https://www.amazon.com/dp/0764578650). 10th Anniversary Edition. Boston, MA: Houghton Mifflin Harcourt, 2008."
child_french_cooking = "Child, Julia, Louisette Bertholle, and Simone Beck. [*Mastering the Art of French Cooking: Volume 1*](https://www.amazon.com/dp/0375413405). New York, NY: Knopf, 2001."
fauda_role_vegan_one_pot = "Fauda-Rôle, Sabrina. _Vegan One Pot._ München: Dorling Kindersley Verlag GmbH, 2023."
forkish_elements_of_pizza = "Forkish, Ken. [*The Elements of Pizza: Unlocking the Secrets to World-Class Pies at Home*](https://amazon.com/dp/160774838X). New York, NY: Ten Speed Press, 2016."
forkish_flour_water_salt_yeast = "Forkish, Ken. [*Flour Water Salt Yeast: The Fundamentals of Artisan Bread and Pizza*](https://amazon.com/dp/160774838X). New York, NY: Ten Speed Press, 2012."
hazan_italian_cooking = "Hazan, Marcella, and Karin Kretschmann. [*Essentials of Classic Italian Cooking*](https://www.amazon.com/dp/039458404X). New York, NY: Alfred A. Knopf, 1992."
ludwinski_sister_pie = "Ludwinski, Lisa, and E. E. Berger. [*Sister Pie: The Recipes & Stories of a Big-hearted Bakery in Detroit*](https://www.amazon.com/dp/0399579761). California: Lorena Jones Books, an Imprint of Crown Publishing Group, 2018."
"müller_walser_mein_erstes_kochbuch" ="Müller, Anna, and Olga Walser. [Mein Erstes Kochbuch: Mit Servierkunde und Nahrungsmittellehre.](https://www.amazon.de/Mein-erstes-Kochbuch-Servierkunde-Nahrungsmittellehre/dp/B0028S3CM0) Verlag E. DORNER Gmbh, 2017."
"oberndorfer_knödel" ="Oberndorfer, Florian, and Zabert Sandmann. [*Knödel: Die Besten Klassischen Und Internationalen Knödelrezepte.*](https://www.amazon.de/dp/396584170X) München Zs, 2021."
perelman_the_smitten_kitchen_cookbook = "Perelman, Deb. [*The Smitten Kitchen Cookbook*](https://www.amazon.com/dp/030759565X/). New York, NY: Alfred A. Knopf, 2017."

[project.validation]
unused_footnotes = false

[project.plugins]
awesome-nav = {}
tags = {}
"minify".minify_html = true
"search".lang = "en"

[project.plugins.llmstxt]
markdown_description = "Nick's personal recipe collection."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
Home = ["index.md"]
Beverages = ["beverages/*.md", "beverages/**/*.md"]
Breads = ["breads/*.md", "breads/**/*.md"]
Casseroles = ["casseroles/*.md", "casseroles/**/*.md"]
Curries = ["curries/*.md", "curries/**/*.md"]
Desserts = ["desserts/*.md", "desserts/**/*.md"]
Dumplings = ["dumplings/*.md", "dumplings/**/*.md"]
Eggs = ["eggs/*.md", "eggs/**/*.md"]
Grains = ["grains/*.md", "grains/**/*.md"]
Legumes = ["legumes/*.md", "legumes/**/*.md"]
Meats = ["meats/*.md", "meats/**/*.md"]
Noodles = ["noodles/*.md", "noodles/**/*.md"]
Salads = ["salads/*.md", "salads/**/*.md"]
Sandwiches = ["sandwiches/*.md", "sandwiches/**/*.md"]
Sauces = ["sauces/*.md", "sauces/**/*.md"]
Seasonings = ["seasonings/*.md", "seasonings/**/*.md"]
Soups = ["soups/*.md", "soups/**/*.md"]
Spreads = ["spreads/*.md", "spreads/**/*.md"]
Vegetables = ["vegetables/*.md", "vegetables/**/*.md"]

[project.theme]
custom_dir = "overrides/"
language = "en"
favicon = "assets/images/shallow-pan-of-food-32x32.png"
features = [
  "header.autohide",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tracking",
  "toc.follow",
]

[project.theme.font]
text = "Courier Prime"
code = "Courier Prime"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "material/silverware"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
"pymdownx.details" = {}
"pymdownx.snippets" = {}
"pymdownx.superfences" = {}
"pymdownx.tabbed".alternate_style = true
"zensical.extensions.macros" = {}
