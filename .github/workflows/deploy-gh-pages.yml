name: deploy-gh-pages

on: [push]

# One run per branch. Superseded branch runs are cancelled, but main runs are
# allowed to finish so production deployments complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen

        # the zensical-build hook builds the site into site/en
      - uses: j178/prek-action@v2

        # fix file permissions before packaging; GitHub Pages requires all files to be readable
      - name: Fix permissions
        run: |
          chmod -c -R +rX "site/en/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Package artifact
        run: tar --dereference --hard-dereference --exclude=.git --exclude=.github --exclude='.[^/]*' -cf "$RUNNER_TEMP/artifact.tar" -C site/en .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
